name: Deploy to VPS

on:
    workflow_call:
        secrets:
            DEPLOY_KEY:
                required: true
            DEPLOY_KNOWN_HOSTS:
                required: true

permissions:
    contents: read

jobs:
    deploy:
        runs-on: [ubuntu-latest]
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.8"

            - name: Set up uv
              uses: astral-sh/setup-uv@v7

            - name: Install pinned SSH host keys
              shell: bash
              env:
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  umask 077
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"

            - name: Install SSH key
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.DEPLOY_KEY }}

            - name: Deploy tested commit to VPS
              shell: bash
              env:
                  DEPLOY_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  trap 'rm -f "$RUNNER_TEMP/deploy_known_hosts"' EXIT
                  [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
                  sass_version=$(uv run --locked scripts/compile_sass.py --print-version)
                  ssh \
                    -o StrictHostKeyChecking=yes \
                    -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts" \
                    -o GlobalKnownHostsFile=/dev/null \
                    -o BatchMode=yes \
                    github@theodorblom.com "bash -s -- $DEPLOY_SHA $sass_version" \
                    < scripts/deploy.sh
