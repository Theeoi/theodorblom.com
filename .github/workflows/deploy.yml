---
name: Deploy to VPS

"on":
    workflow_call:
        secrets:
            DEPLOY_KEY:
                required: true
            DEPLOY_KNOWN_HOSTS:
                required: true

permissions:
    contents: read

jobs:
    deploy:
        runs-on: [ubuntu-latest]
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        steps:
            - name: Check out source
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}

            - name: Download production image
              uses: actions/download-artifact@v8
              with:
                  name: container-production
                  path: ${{ runner.temp }}/production-image

            - name: Install pinned SSH host keys
              shell: bash
              env:
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  umask 077
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
                    > "$RUNNER_TEMP/deploy_known_hosts"

            - name: Install SSH key
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.DEPLOY_KEY }}

            - name: Deploy production image
              shell: bash
              env:
                  DEPLOY_SHA: ${{ github.sha }}
              run: |
                  bash scripts/deploy-from-ci.sh \
                    "$DEPLOY_SHA" \
                    "$RUNNER_TEMP/production-image/container-image.tar" \
                    "$RUNNER_TEMP/deploy_known_hosts"
