# pyproject.toml

[build-system]
requires = ["setuptools >= 65"]
build-backend = "setuptools.build_meta"

[project]
name = "theodorblom.com"
version = "1.0.0"
authors = [{ name = "Theodor Blom", email = "me@theodorblom.com" }]
description = "A personal website deployed as a Flask app instance on a VPS."
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Framework :: Flask",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Unix",
]
dependencies = [
  "Flask >= 3.1.1, < 4",
  "Flask-login >= 0.6.3, < 1",
  "Flask-sqlalchemy >= 3.1.1, < 4",
  "SQLAlchemy >= 2.0.16, < 2.1",
  "Flask-Migrate >= 4.0.5, < 5",
  "Flask-Sitemap >= 0.4.0, < 1",
  "python-slugify >= 9.1.1, < 10",
  "markdown >= 3.11, < 4",
  "jinja2-fragments >= 1.7, < 2",
  "tomli >= 2, < 3",
]

[tool.sass]
version = "1.104.0"

[project.optional-dependencies]
dev = ["pytest >= 9.1, < 10", "pytest-cov >= 7.1, < 8"]
deploy = [
    "gunicorn >= 26, < 27",
]

[tool.setuptools.package-data]
"website.templates" = ["**/**"]
"website.static" = ["**/**"]

[tool.pytest.ini_options]
addopts = "-v --cov=./src"
testpaths = "tests"
filterwarnings = [
    'ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning:flask_login\.login_manager',
    'ignore:The Query\.get\(\) method is considered legacy:sqlalchemy.exc.LegacyAPIWarning:flask_sqlalchemy\.query',
]

[project.urls]
homepage = "https://github.com/Theeoi/theodorblom.com"
